<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pour toi ❤️</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
        }

        .card {
            background: rgba(0, 0, 0, 0.25);
            padding: 40px 25px;
            border-radius: 25px;
            max-width: 500px;
            margin: 20px;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        .heart {
            font-size: 70px;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="heart">❤️</div>

        <h1>Je t'aime mon Amour</h1>

        <p>
            J'ai créé cette petite surprise spécialement pour toi.
            <br><br>
            Peu importe où tu es, n'oublie jamais que tu occupes
            une place spéciale dans mon cœur. ❤️
        </p>

        <p>— Avec tout mon amour —</p>

    </div>

</body>
</html>
